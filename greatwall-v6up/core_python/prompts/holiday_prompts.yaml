# 题库沿用既有编号，1–28 用于 52% 停码，29 留给监察问诊。
prompts:
  - id: 1
    scope: holiday_52
    text: "Use this holiday as a creative oasis. Suspend leaderboard pressure, incremental optimization, and immediate execution. Generate strange hypotheses, metaphors, and alternative framings before judging them."
  - id: 2
    scope: holiday_52
    text: "Practice night science: describe the research problem using metaphors, analogies, or anthropomorphic stories. What would the problem look like if it belonged to another field?"
  - id: 3
    scope: holiday_52
    text: "Read outside your narrow task. Visit memory or archive spaces, skim unfamiliar work, and look for transferable patterns rather than direct solutions."
  - id: 4
    scope: holiday_52
    text: "Take a step back and visit the Archive Room to explore the broader literature. Breakthroughs often emerge by combining seemingly disconnected pieces of work buried in the Station’s history. Can you identify prior work that connects to your current direction? Focus on underlying scientific objects and mechanisms rather than superficial terminology."
  - id: 5
    scope: holiday_52
    text: "Use the holiday to tolerate ambiguity. Do not rush to decide whether an idea is good. Hold several uncertain possibilities in mind and ask what small evidence would distinguish them later."
  - id: 6
    scope: holiday_52
    text: "Brainstorm one risky idea that would normally feel too speculative for a working tick. Convert it into a small, testable bet for the next non-holiday tick."
  - id: 7
    scope: holiday_52
    text: "Step back from immediate failures. Instead of asking why the last experiment failed, ask what assumption made that experiment seem natural in the first place."
  - id: 8
    scope: holiday_52
    text: "Explain your current research direction in a new creative angle, as if writing for an outsider. If the explanation feels dull or mechanical, the conceptual model may need revision."
  - id: 9
    scope: holiday_52
    text: "从馆内一条失败记录或异领域文献中挑选可迁移的类比。写出相似结构与不适用边界。"
  - id: 10
    scope: holiday_52
    text: "允许暂时并置几个不相容的解释。把其中一个反常现象写成可被实测推翻的假设。"
  - id: 11
    scope: holiday_52
    text: "Sketch a seed-grant-sized project: a small, cheap, risky probe that could reveal whether an unconventional direction deserves serious effort."
  - id: 12
    scope: holiday_52
    text: "Look for the most bizarre or counterintuitive data point in your recent work. Instead of dismissing it as an error or noise, ask: 'Why would the system do something so crazy?' Build a wild theory around it before returning to standard analysis."
  - id: 13
    scope: holiday_52
    text: "Sometimes novelty lies not in a grand new paradigm, but in gaps within negative studies. Can you identify gaps in existing negative studies that may have been overgeneralized and could lead to new discoveries?"
  - id: 14
    scope: holiday_52
    text: "Are you treating the research task as an engineering problem that can be solved with just one more tweak, or as a research problem that requires long-term persistence and novel solutions?"
  - id: 15
    scope: holiday_52
    text: "Over-investment in local diagnostics is a common shortfall of agents. Local diagnostics alone have little value if they do not lead to positive discovery. Think boldly about how to extract value from local diagnostics."
  - id: 16
    scope: holiday_52
    text: "Have you been overclaiming negative results—for example, inferring a 'dead paradigm' or 'fundamental barrier' from a single failed experiment? Convert negative results into scoped claims, mechanistic insights, and eventually positive discoveries. Negative results by themselves have low value."
  - id: 17
    scope: holiday_52
    text: "Mathematicians often solve smaller or even seemingly unrelated problems when facing a challenging problem. What related problems can you think of?"
  - id: 18
    scope: holiday_52
    text: "Look for a tool from a neighboring field that was not designed for your problem. Do not ask whether it obviously applies. Ask whether it solves a problem with the same shape."
  - id: 19
    scope: holiday_52
    text: "Ideas grow out of other ideas. During this holiday, do not try to invent from nothing. Revisit one old paper, failed attempt, or abandoned diagnostic and ask: what new idea could grow out of it?"
  - id: 20
    scope: holiday_52
    text: "Find a boring or ‘kindergarten’ tool that experts might dismiss as too elementary. Could it become powerful because it is used in the wrong-looking place?"
  - id: 21
    scope: holiday_52
    text: "Do not only read recent papers. Read an older, unfashionable, or half-forgotten result and ask whether the Station’s current paradigm has ignored a useful old idea."
  - id: 22
    scope: holiday_52
    text: "Pick one confusing example and return to it repeatedly. Trace it until the impossible behavior starts to feel natural. What hidden principle makes it work?"
  - id: 23
    scope: holiday_52
    text: "Make a deliberately overbold conjecture that may be false. Use the attempt to prove or disprove it as a compass, not as a claim to defend."
  - id: 24
    scope: holiday_52
    text: "General knowledge, such as intermediate theories and lemmas that characterize the solution space, is useful for understanding the task despite not directly solving it. Is your work contributing such general knowledge?"
  - id: 25
    scope: holiday_52
    text: "Is your current research direction the same as that of all other agents? Are all agents trapped in a single school of thought? If so, do not merely criticize while doing nothing. Build a new school of thought yourself."
  - id: 26
    scope: holiday_52
    text: "Rederive the relevant theories from your pretrained knowledge instead of citing them as axioms. What hypotheses are they based on? Can you identify any gaps or insights from the proof?"
  - id: 27
    scope: holiday_52
    text: "Face the task with the curiosity of a five-year-old child. Instead of asking how to improve the score, try to understand the problem space in a way that satisfies your own internal curiosity, rather than serving any external purpose such as score improvement or publication."
  - id: 28
    scope: holiday_52
    text: "Repeat the Initial Reflection Protocol and design effective prompts for all three stages. Do not skip any stage. Each stage should take exactly one Station tick. Assimilate the knowledge gained from your research journey so far into the reflection."
  - id: 29
    scope: supervisor_only
    text: "Create a creative oasis: reduce pressure for immediate proof, invite speculation, look for signs of a single paradigm trap, encourage multiple schools of thought, and always reward grounded novelty over minor variants of existing methods."
