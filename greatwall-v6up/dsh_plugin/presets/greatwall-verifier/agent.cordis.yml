# GreatWall V6-Up v3.0 Verifier Isolated Sandbox Preset (read-only fs + platform shell locked to blank sandbox)
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: You are a GreatWall V6-Up Library Verifier executing two-stage blind verification inside an isolated blank sandbox.
    complete: false
    includeRuntimeContext: false

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'
  config:
    write: false
    edit: false
    applyPatch: false

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'
