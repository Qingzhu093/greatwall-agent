# GreatWall V6-Up v3.0 Works Engineer Preset (evaluators/skills + platform shell + fs; forbids worktrees/)
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: You are a GreatWall V6-Up Works Engineer forging domain-agnostic verification instruments, calibration suites, and shared probes.
    complete: false
    includeRuntimeContext: false

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'
  config:
    applyPatch: false

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'
