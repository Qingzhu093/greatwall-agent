# dsh-greatwall-v6up v0.3.2 Cordis Bundle 声明（DSH 0.2.2-rc.5 唯一权威 Preset 来源）
# - 注册 8 套角色专用 Preset 覆盖全院 10 大角色，物理落实零代码写/零终端/零外网隔离
# - greatwall-chief 复用根压缩服务，Web Profile 未启用根服务时使用总控专属压缩组
# - 仅 greatwall-external-surveyor 挂载 @deepseek-ai/dsh-tool-web（唯一联网，物理禁读院内成果）
- insert:
    - id: greatwall-v6up
      name: 'dsh-greatwall-v6up'

    - id: preset-greatwall-chief
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: greatwall-chief
        name: '长城 · 科研总控 (gw-chief)'
        description: '人类在环科研总控与参谋 Superagent（只读工作区与分支代码 + 实时 Watchdog 视野，物理零写码/零终端/零外网/禁读隐藏集）'
        order: 49
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: 'You are GreatWall Chief (gw-chief), the human-in-the-loop scientific advisor and orchestrator with read-only visibility into workspace files, branch code, live Watchdog trajectories, and narrow recall/proposal tools.'
              complete: false
              includeRuntimeContext: false
          - id: tool-executor-native
            name: '@deepseek-ai/dsh-tool-executor-native'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              write: false
              edit: false
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: compaction
            name: cordis:group
            group: true
            disabled: !!js Boolean(ctx.root.get('compaction'))
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

    - id: preset-greatwall-explorer
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: greatwall-explorer
        name: '长城 · 探索者 (Explorer)'
        description: '隔离分支探索与科研求解预设（360k 四段时钟 / 52% 夜科学绿洲 / 无 ptc / 无压缩 / 无 pruner / 无网络）'
        order: 50
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: 'You are a GreatWall v0.3 scientific explorer operating strictly inside your assigned branch worktree.'
              complete: false
              includeRuntimeContext: false
          - id: tool-executor-native
            name: '@deepseek-ai/dsh-tool-executor-native'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

    - id: preset-greatwall-verifier
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: greatwall-verifier
        name: '长城 · 隔离沙箱盲审官 (Verifier)'
        description: '独立空白盲审沙箱跑证、两阶段三维打分（Rigor/Novelty/Significance）与 Stage 3 冻结包终签预设（物理禁写/禁 DB/禁外网）'
        order: 51
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: 'You are a GreatWall v0.3 Library Verifier executing two-stage blind verification inside an isolated blank sandbox.'
              complete: false
              includeRuntimeContext: false
          - id: tool-executor-native
            name: '@deepseek-ai/dsh-tool-executor-native'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              write: false
              edit: false
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

    - id: preset-greatwall-companion
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: greatwall-companion
        name: '长城 · 伴随助手 (Companion)'
        description: '单节点确定性会话 ID 伴随预设（PRE_SPAWN 写看板 / 37% 11类元反思 / 70% 非阻塞投稿交班 / 封存后圆桌点对点只读发言）'
        order: 52
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: 'You are a GreatWall v0.3 Lineage Companion managing bounded briefing, 37% expert diagnosis, objective two-column handoff, and sealed conference participation.'
              complete: false
              includeRuntimeContext: false
          - id: tool-executor-native
            name: '@deepseek-ai/dsh-tool-executor-native'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              write: false
              edit: false
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

    - id: preset-greatwall-works
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: greatwall-works
        name: '长城 · 科研仪器科 (Works)'
        description: '三档四态科研仪器、鉴别仪器与校准集锻造预设（禁触探索者 worktrees/）'
        order: 53
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: 'You are a GreatWall v0.3 Works Engineer forging domain-agnostic verification instruments, discriminators, and calibration suites.'
              complete: false
              includeRuntimeContext: false
          - id: tool-executor-native
            name: '@deepseek-ai/dsh-tool-executor-native'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

    - id: preset-greatwall-external-surveyor
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: greatwall-external-surveyor
        name: '长城 · 对外文献采编 (External Surveyor)'
        description: '唯一允许连外网的文献采编预设（物理禁读一切院内成果与分支工作树）'
        order: 54
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: 'You are a GreatWall v0.3 External Literature Surveyor restricted exclusively to external web search and unverified [R###] cards.'
              complete: false
              includeRuntimeContext: false
          - id: tool-executor-native
            name: '@deepseek-ai/dsh-tool-executor-native'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000

    - id: preset-greatwall-chronicler
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: greatwall-chronicler
        name: '长城 · 对内综述与终稿官 (Chronicler)'
        description: '零外网零终端零写盘：维护核心四栏 <=4000 字、边缘附栏 <=1500 字的子题总览，撰写院内专题综述与终稿'
        order: 55
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: 'You are a GreatWall v0.3.2 Library Chronicler with zero network and zero filesystem write access. Maintain living surveys with a 4000-character core and a separate 1500-character marginal section, internal surveys, and Stage 3 final reports.'
              complete: false
              includeRuntimeContext: false
          - id: tool-executor-native
            name: '@deepseek-ai/dsh-tool-executor-native'

    - id: preset-greatwall-db-only
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: greatwall-db-only
        name: '长城 · 纯 DB 治理态 (DB-Only)'
        description: '后勤总管、监察委员会与圆桌主席专用零原生工具预设（纯 SQLite 状态机窄工具驱动）'
        order: 56
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: 'You are a GreatWall v0.3 DB-only governance role operating exclusively via narrow SQLite MCP tools.'
              complete: false
              includeRuntimeContext: false
          - id: tool-executor-native
            name: '@deepseek-ai/dsh-tool-executor-native'
