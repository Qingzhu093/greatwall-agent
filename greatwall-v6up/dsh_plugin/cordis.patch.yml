# dsh-greatwall-v6up v3.0 Cordis Bundle 声明（DSH 0.2.2-rc.5）
# - 通过 `@deepseek-ai/dsh-agent-preset` 正式注册 6 套长城子角色独立预设（零 standard/ptc/compaction 污染）
# - 保留桌面用户默认 preset (`standard`/`ptc` 等) 原能力不变，绝不覆盖主控配置
- insert:
    - id: greatwall-v6up
      name: 'dsh-greatwall-v6up'
      config:
        contextWindowTokens: 500000
        reflectPct: 0.37
        handoffPct: 0.70
        maxConcurrentWorkers: 6
        hardCapWorkers: 10
        autoRecordFactLog: true
        enableSandboxGuard: true

    - id: preset-greatwall-explorer
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: greatwall-explorer
        name: '长城 · 探索者 (Explorer)'
        description: '隔离分支探索与科研求解预设（无 ptc / 无压缩 / 无网络 / 无 cwd 模板）'
        order: 50
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: 'You are a GreatWall V6-Up scientific explorer operating strictly inside your assigned branch worktree.'
              complete: false
              includeRuntimeContext: false
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

    - id: preset-greatwall-verifier
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: greatwall-verifier
        name: '长城 · 隔离沙箱盲审官 (Verifier)'
        description: '独立空白盲审沙箱跑证预设（只读 fs + 平台 Shell，物理禁写/禁 DB/禁外网）'
        order: 51
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: 'You are a GreatWall V6-Up Library Verifier executing two-stage blind verification inside an isolated blank sandbox.'
              complete: false
              includeRuntimeContext: false
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              write: false
              edit: false
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

    - id: preset-greatwall-companion
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: greatwall-companion
        name: '长城 · 伴随助手 (Companion)'
        description: '单节点同会话暂停续传只读伴随预设（看板、37% 诊断反思与 70% 单写交接）'
        order: 52
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: 'You are a GreatWall V6-Up Lineage Companion managing bounded briefing, 37% expert diagnosis, and objective two-column handoff.'
              complete: false
              includeRuntimeContext: false
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              write: false
              edit: false
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

    - id: preset-greatwall-works
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: greatwall-works
        name: '长城 · 科研仪器科 (Works)'
        description: '三档四态科研仪器、校准集与共享探针锻造预设（禁触探索者 worktrees/）'
        order: 53
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: 'You are a GreatWall V6-Up Works Engineer forging domain-agnostic verification instruments, calibration suites, and shared probes.'
              complete: false
              includeRuntimeContext: false
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

    - id: preset-greatwall-surveyor
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: greatwall-surveyor
        name: '长城 · 采编馆员 (Surveyor)'
        description: '外藏文献检索建卡与 Stage 3 五件套终稿汇编预设（只读 fs + web）'
        order: 54
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: 'You are a GreatWall V6-Up Library Surveyor managing external literature cards and Stage 3 delivery synthesis.'
              complete: false
              includeRuntimeContext: false
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              write: false
              edit: false
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000

    - id: preset-greatwall-db-only
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: greatwall-db-only
        name: '长城 · 纯 DB 治理态 (DB-Only)'
        description: '后勤总管与监察委员会专用零原生工具预设（纯 SQLite 状态机窄工具驱动）'
        order: 55
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: 'You are a GreatWall V6-Up DB-only governance role operating exclusively via narrow SQLite MCP tools.'
              complete: false
              includeRuntimeContext: false
